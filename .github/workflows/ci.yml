name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install

      # Build MUST precede typecheck: workspace packages import each other through
      # their built .d.ts files, so `tsc --noEmit` cannot resolve a sibling package
      # until that package has been built.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  swift-test:
    name: swift test (nexus-mac)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      # Serial, single job, no matrix: concurrent `swift test` runs manufacture
      # spurious failures from SwiftPM lock contention (a 1.45s test observed
      # taking 1053s under concurrency), so this must not be parallelized.
      - name: Swift test
        working-directory: apps/nexus-mac
        env:
          NEXUS_REQUIRE_CLI: "1"
        run: swift test
